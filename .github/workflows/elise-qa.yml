name: Elise Learning QA
on:
  push:
    branches: [main, 'feature/**', 'architecture/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  curriculum:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run curriculum QA
        run: node tests/qa-ci.js
