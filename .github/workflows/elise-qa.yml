name: Elise Learning V4 QA
on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  v4-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Functional API, rules, migration, notifications and content tests
        run: npm run check
      - name: Mathematics teacher oracle and diversity checks
        run: node v4/content/math.selfcheck.mjs
      - name: Build public assets without answer banks or server source
        run: node scripts/build-v4.mjs
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser regression quality to normal and full learning journeys
        run: node --test tests/v4-e2e.spec.mjs
      - name: Preserve QA results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v4-qa-results
          path: |
            test-results/
            docs/v4/implementation-qa.md
          if-no-files-found: ignore
